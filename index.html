<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TIME.BLOCK</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="topbar-left">
          <div class="logo">TIME<span>.</span>BLOCK</div>
          <div class="topbar-subtitle">2D video → stacked time volume</div>
        </div>
        <div class="topbar-right">
          <select class="sel" id="preset"></select>
          <button class="btn btn--accent" id="export-btn" disabled>Export ▶</button>
        </div>
      </header>

      <main id="main">
        <aside class="panel" id="left">
          <section class="panel-section">
            <div class="section-title static"><span>Source</span></div>
            <label id="drop" class="drop">
              <input type="file" id="file" accept="video/mp4,video/quicktime,video/webm,video/*,.glb,model/gltf-binary" hidden />
              <strong>MP4 · GLB 드래그 앤 드롭</strong>
              <span>또는 클릭해서 선택 · 브라우저 안에서만 처리</span>
            </label>
            <div id="src-info" class="note mono hidden"></div>
          </section>
          <section class="panel-section hidden" id="range-section">
            <div class="section-title static"><span>Time range</span></div>
            <div id="range-ctrls"></div>
            <button class="btn btn--sm btn--block hidden" id="match-fps" type="button">원본 프레임 전부 사용</button>
            <div id="sample-info" class="note mono"></div>
          </section>
          <section class="panel-section hidden" id="thumb-section">
            <div class="section-title static"><span>Frames</span></div>
            <div id="thumbs"></div>
          </section>
        </aside>

        <section id="stage">
          <div id="viewport">
            <canvas id="gl"></canvas>
            <canvas id="overlay"></canvas>
            <div id="empty" class="overlay">
              <div class="empty-mark">TIME<span>.</span>BLOCK</div>
              <p>왼쪽 패널이나 이 화면에 MP4를 놓으면 프레임을 시간축으로 쌓습니다.</p>
              <p class="hint">우클릭 드래그 회전 · 휠 줌 · 중클릭 이동</p>
            </div>
            <div id="progress" class="overlay hidden">
              <div class="progress-label" id="progress-label">Sampling frames…</div>
              <div class="bar"><i id="progress-bar"></i></div>
              <button class="btn btn--sm" id="progress-cancel">취소</button>
            </div>
          </div>
        </section>

        <aside class="panel" id="right"></aside>
      </main>

      <footer id="timeline">
        <button class="tl-play" id="tl-play" aria-label="Pause"></button>
        <input type="range" id="tl-scrub" min="0" max="1000" step="1" value="0" />
        <span id="tl-time" class="mono">0.00 / 0.00</span>
        <div id="tl-pip" class="tl-pip"></div>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
